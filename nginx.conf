# Nginx configuration for large file uploads
# Place this in your nginx server block or include it in your main nginx.conf
# If using nginx as reverse proxy, add these directives to your server block

server {
    # ... your existing server configuration ...
    
    # Increase client body size limit to 2GB
    client_max_body_size 2048M;
    
    # Increase buffer sizes for large uploads
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Increase timeouts for large uploads
    client_body_timeout 300;
    client_header_timeout 300;
    send_timeout 300;
    
    # ... rest of your server configuration ...
}

